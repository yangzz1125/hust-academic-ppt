<div class="card" data-grid="0,0,7,6"><div class="hd">示意：热量先落在哪里</div>
  <div class="bd"><div class="ph" data-kind="原生示意图">左：烤箱、烧烤，红外和热风只把热量落在表面薄薄一层；<br>右：微波炉，直接加热外层约 1 cm，里面靠热传导</div>
  <span class="small" style="text-align:center">含水多的食物，微波直接加热的深度可达数厘米</span></div></div>
<div class="card" data-grid="7,0,5,3"><div class="hd soft">频率越低，进得越深</div>
  <div class="bd"><ul><li>2.45 GHz 只进入多数食物约 1 cm</li><li>工业炉常用 915 MHz，波长 32.8 cm</li><li>频率越低，电场进入非导体越深</li></ul></div></div>
<div class="card" data-grid="7,3,5,3"><div class="hd soft">不是从里往外熟</div>
  <div class="bd"><ul><li>外层先热，里面靠热传导</li><li>表层干、下面湿时，里面吸热更多</li><li>解冻用低功率，给热传导留时间</li></ul></div></div>
