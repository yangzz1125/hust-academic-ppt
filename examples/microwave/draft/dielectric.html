<div class="solid mid" data-grid="0,2,1,4" style="text-align:center"><h4>吸热功率密度</h4><p>单位 W/m³<br>食物每一处升温有多快</p><span class="small" style="color:#fff">要求的量</span></div>
<div class="tint mid" data-grid="1,2,1,4" style="text-align:center"><h4>角频率</h4><p><i>ω</i> = 2π<i>f</i><br>电场每秒振荡 24.5 亿次</p><span class="small">水分子跟着来回转</span></div>
<div class="tint mid" data-grid="2,2,1,4" style="text-align:center"><h4>真空介电常数</h4><p>物理常数<br>对所有食物都一样</p><span class="small">不随食物变</span></div>
<div class="tint accent mid" data-grid="3,2,1,4" style="text-align:center"><h4>损耗因子</h4><p>介电常数的虚部<br>分子转动时推挤碰撞生热</p><span class="em">含水多的部分大，先热</span></div>
<div class="tint mid" data-grid="4,2,1,4" style="text-align:center"><h4>场强的平方</h4><p>电场强度 <i>E</i><br>场强翻一倍，吸热变成 4 倍</p><span class="small">场强大处成热点</span></div>
